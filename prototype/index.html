<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open TV Prototype</title>
<style>
:root{--text:#F5F7FB;--t2:rgba(245,247,251,.68);--t3:rgba(245,247,251,.46);--accent:#5B8CFF;--mint:#3DD6B0;--live:#FF4D5E;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:Inter,"Helvetica Neue",Arial,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;user-select:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#tvbox{position:relative;width:1920px;height:1080px;flex:none;overflow:hidden;transform-origin:center center;background:#070A14}
#wall{position:absolute;inset:0;background:radial-gradient(900px 600px at 12% 8%,rgba(91,140,255,.45),transparent 60%),radial-gradient(800px 700px at 92% 18%,rgba(124,92,255,.40),transparent 60%),radial-gradient(900px 700px at 70% 110%,rgba(61,214,176,.28),transparent 60%),linear-gradient(160deg,#0E1630,#0A0F1F 55%,#070A14)}
#view{position:absolute;inset:0;transition:filter .4s}
#view.enter{animation:enter .26s var(--ease)}
@keyframes enter{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
#dim{position:absolute;inset:0;background:#000;pointer-events:none;z-index:90;transition:opacity .2s}
#warm{position:absolute;inset:0;background:#FF9A3C;mix-blend-mode:multiply;opacity:0;pointer-events:none;z-index:89;transition:opacity .4s}
#layers{position:absolute;inset:0;z-index:50;pointer-events:none}
#layers>*{pointer-events:auto}
.abs{position:absolute}.row{display:flex;align-items:center}.col{display:flex;flex-direction:column}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px)}
[data-f]{cursor:pointer;transition:transform .18s var(--ease),box-shadow .18s var(--ease),background-color .18s,color .18s}
[data-act]{cursor:pointer}
.scroller{overflow:auto;scrollbar-width:none}.scroller::-webkit-scrollbar{display:none}
.g-red{background:linear-gradient(135deg,#FF6A6A,#C8324E)}.g-blue{background:linear-gradient(135deg,#4F7BFF,#2A3FD9)}.g-violet{background:linear-gradient(135deg,#9B7BFF,#5A3BE0)}.g-mint{background:linear-gradient(135deg,#3DD6B0,#14907A)}.g-sun{background:linear-gradient(135deg,#FFC24B,#F07A2B)}.g-slate{background:linear-gradient(135deg,#4A5674,#262E44)}.g-rose{background:linear-gradient(135deg,#FF7DA8,#C23A78)}.g-sky{background:linear-gradient(135deg,#5ED0FF,#2385D6)}.g-store{background:linear-gradient(135deg,#5B8CFF,#7C5CFF)}

/* generic focus */
.is-focus{box-shadow:0 0 0 4px #fff,0 24px 64px rgba(91,140,255,.5)!important;transform:scale(1.05);z-index:5;position:relative}

/* status bar */
.status{position:absolute;top:48px;left:96px;right:96px;height:64px;display:flex;align-items:center;justify-content:space-between}
.clock{font-size:44px;font-weight:600;letter-spacing:-1px}
.date{font-size:22px;color:var(--t2);font-weight:500}
.chip{height:56px;min-width:56px;padding:0 16px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:10px}
.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#FF8A5B,#FF5C8A);border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px}

/* home */
.greet{font-size:64px;font-weight:700;letter-spacing:-1.6px}
.tile{position:relative;width:392px;height:240px;border-radius:28px;padding:28px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(255,255,255,.12);flex:none}
.tile .glyph{width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center}
.tile .name{font-size:28px;font-weight:600;letter-spacing:-.3px}.tile .sub{font-size:18px;color:rgba(255,255,255,.72);margin-top:4px;font-weight:500}
.tile.is-focus{transform:scale(1.08)}
.pin{width:200px;height:120px;border-radius:20px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-size:20px;font-weight:600;flex:none}
.pin .ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.pin.is-focus{background:rgba(255,255,255,.2)}
.hints{position:absolute;bottom:44px;left:0;right:0;display:flex;justify-content:center;gap:40px;font-size:18px;color:var(--t3);font-weight:500}
.key{display:inline-flex;align-items:center;height:30px;padding:0 10px;border-radius:8px;border:1px solid rgba(255,255,255,.22);font-size:15px;font-weight:600;color:var(--t2);margin-right:10px}

/* apps */
.title-xl{font-size:56px;font-weight:700;letter-spacing:-1.4px}
.fchip{height:52px;padding:0 26px;border-radius:26px;display:flex;align-items:center;font-size:20px;font-weight:600;color:var(--t2)}
.fchip.on{background:#fff;color:#0B0F1A}
.fchip.is-focus{transform:scale(1.06)}
.app{width:180px;display:flex;flex-direction:column;align-items:center;gap:16px}
.app .icon{width:156px;height:156px;border-radius:40px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.app .t{font-size:20px;font-weight:500;color:var(--t2);text-align:center;white-space:nowrap}
.app.is-focus{box-shadow:none!important;transform:none}
.app.is-focus .icon{transform:scale(1.1);box-shadow:0 0 0 4px #fff,0 26px 60px rgba(91,140,255,.55)}
.app.is-focus .t{color:#fff;font-weight:600}
.icon{display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.14);color:#fff;flex:none;transition:transform .18s var(--ease),box-shadow .18s}

/* settings */
.side{position:absolute;top:96px;left:96px;width:560px;height:888px;border-radius:40px;padding:40px 28px}
.side h2{font-size:44px;font-weight:700;letter-spacing:-1px;padding:0 16px 28px}
.nit{height:68px;border-radius:20px;display:flex;align-items:center;gap:18px;padding:0 16px;font-size:23px;font-weight:500;color:var(--t2);margin-bottom:6px}
.nit .b{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff}
.nit.sel{color:#fff;font-weight:600;background:rgba(255,255,255,.1)}
.nit.is-focus{background:rgba(255,255,255,.18);transform:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)!important}
.smain{position:absolute;top:96px;left:696px;right:96px;bottom:0;padding:40px 8px 60px}
.crumb{font-size:20px;color:var(--t3);font-weight:500;margin:0 0 8px 8px}
.h1{font-size:52px;font-weight:700;letter-spacing:-1.2px;margin:0 0 32px 8px}
.gt{font-size:18px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:1.4px;margin:0 0 12px 12px}
.grp{border-radius:28px;margin-bottom:28px;overflow:hidden}
.ri{min-height:88px;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;font-size:24px;font-weight:500;border-bottom:1px solid rgba(255,255,255,.08);gap:24px}
.ri:last-child{border-bottom:none}.ri .d{font-size:18px;color:var(--t3);margin-top:4px;font-weight:400}
.ri .v{color:var(--t2);font-size:22px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.ri.is-focus{background:rgba(255,255,255,.16);transform:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.75)!important}
.sw{width:76px;height:44px;border-radius:22px;background:rgba(255,255,255,.18);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:left .2s var(--ease)}
.sw.on{background:var(--mint)}.sw.on::after{left:36px}
.track{position:relative;width:420px;height:10px;border-radius:5px;background:rgba(255,255,255,.18)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:#fff}
.track .fill::after{content:"";position:absolute;right:-12px;top:-7px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}

/* quick panel & overlays */
.scrim{position:absolute;inset:0;background:rgba(5,7,13,.55);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.qp{position:absolute;top:48px;right:48px;bottom:48px;width:640px;border-radius:48px;padding:44px;background:rgba(28,34,52,.72);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(60px);-webkit-backdrop-filter:blur(60px);display:flex;flex-direction:column;gap:22px;animation:slidein .28s var(--ease)}
@keyframes slidein{from{transform:translateX(60px);opacity:0}}
.qt{height:132px;border-radius:28px;padding:22px 24px;display:flex;flex-direction:column;justify-content:space-between;background:rgba(255,255,255,.10)}
.qt .tt{font-size:22px;font-weight:600}.qt .ts{font-size:17px;color:var(--t2);margin-top:2px}
.qt.on{background:#fff;color:#0B0F1A}.qt.on .ts{color:rgba(11,15,26,.6)}
.qt .ci{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.16)}
.qt.on .ci{background:var(--accent);color:#fff}
.qt.is-focus{box-shadow:0 0 0 4px var(--accent),0 18px 50px rgba(91,140,255,.45)!important;transform:scale(1.04)}
.slider{height:96px;border-radius:28px;background:rgba(255,255,255,.10);position:relative;overflow:hidden;display:flex;align-items:center;padding:0 28px;font-size:22px;font-weight:600}
.slider .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.9);transition:width .12s}
.slider .in{position:relative;display:flex;align-items:center;gap:18px;color:#0B0F1A;mix-blend-mode:normal}
.slider .pct{position:absolute;right:28px;color:var(--t2);font-size:20px}
.slider.is-focus{transform:scale(1.03);box-shadow:0 0 0 4px var(--accent)!important}
.pbtn{flex:1;height:76px;border-radius:38px;background:rgba(255,255,255,.10);display:flex;align-items:center;justify-content:center;gap:12px;font-size:21px;font-weight:600}
.pbtn.is-focus{background:#fff;color:#0B0F1A;transform:scale(1.04)}
.dialog{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:760px;border-radius:40px;padding:48px;background:rgba(28,34,52,.9);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(60px);animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}}
.dialog h3{font-size:36px;font-weight:700;letter-spacing:-.6px;margin-bottom:12px}
.dialog p{font-size:21px;line-height:1.5;color:var(--t2);margin-bottom:32px}
.dbtn{height:76px;border-radius:24px;background:rgba(255,255,255,.08);display:flex;align-items:center;gap:16px;padding:0 28px;font-size:23px;font-weight:600;margin-top:12px}
.dbtn.danger{color:#FF8A8A}
.dbtn.is-focus{background:#fff;color:#0B0F1A;transform:scale(1.02)}
.hud{position:absolute;right:56px;top:50%;transform:translateY(-50%);width:84px;height:360px;border-radius:42px;padding:22px 0;display:flex;flex-direction:column;align-items:center;gap:16px;background:rgba(28,34,52,.78);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(40px);opacity:0;transition:opacity .2s;pointer-events:none;z-index:95}
.hud.show{opacity:1}
.hud .bar{flex:1;width:12px;border-radius:6px;background:rgba(255,255,255,.18);position:relative;overflow:hidden}
.hud .bar i{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:6px;transition:height .12s}
.toast{position:absolute;top:40px;left:50%;transform:translateX(-50%) translateY(-20px);height:64px;padding:0 28px;border-radius:32px;display:flex;align-items:center;gap:14px;font-size:21px;font-weight:600;background:rgba(28,34,52,.9);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(40px);opacity:0;transition:all .25s var(--ease);z-index:96;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}

/* store */
.brand{position:absolute;top:58px;left:96px;gap:14px;font-size:30px;font-weight:700;letter-spacing:-.5px}
.mark{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.nav{position:absolute;top:48px;left:50%;transform:translateX(-50%);padding:8px;border-radius:40px;gap:6px;display:flex;z-index:6}
.tab{height:60px;padding:0 26px;border-radius:30px;gap:10px;font-size:20px;font-weight:600;color:rgba(245,247,251,.75);display:flex;align-items:center}
.tab.on{background:rgba(255,255,255,.22);color:#fff}
.tab.is-focus{background:#fff;color:#0B0F1A;transform:none;box-shadow:0 10px 30px rgba(91,140,255,.4)!important}
.card{width:184px;gap:6px;display:flex;flex-direction:column;flex:none}
.card .icon{width:184px;height:184px;border-radius:44px;margin-bottom:10px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.card .icon svg{width:76px;height:76px;stroke-width:1.6}
.card .n{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .c{font-size:17px;color:var(--t3);font-weight:500}
.card.is-focus{box-shadow:none!important;transform:none}
.card.is-focus .icon{transform:scale(1.08);box-shadow:0 0 0 4px #fff,0 26px 60px rgba(91,140,255,.55)}
.badge-inst{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;background:rgba(11,15,26,.55);display:flex;align-items:center;justify-content:center}
.shelf-h{display:flex;justify-content:space-between;align-items:center;width:1728px;margin-bottom:22px}
.shelf-h b{font-size:28px;font-weight:700;letter-spacing:-.3px}.shelf-h span{font-size:20px;color:var(--t2);font-weight:600}
.btn{position:relative;overflow:hidden;height:56px;padding:0 28px;border-radius:28px;font-size:20px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap;flex:none}
.btn.L{height:72px;padding:0 40px;border-radius:36px;font-size:24px}
.btn.p{background:#fff;color:#0B0F1A}.btn.a{background:var(--accent);color:#fff}.btn.s{background:rgba(255,255,255,.12);color:#fff}
.btn .pf{position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:rgba(91,140,255,.55);transition:width .1s linear}
.btn .lbl{position:relative;display:flex;align-items:center;gap:10px}
.btn.p.is-focus{box-shadow:0 0 0 4px rgba(255,255,255,.45),0 18px 50px rgba(91,140,255,.6)!important}
.btn.s.is-focus{background:#fff;color:#0B0F1A}
.tag{height:40px;padding:0 16px;border-radius:20px;background:rgba(255,255,255,.14);font-size:17px;font-weight:600;gap:8px;display:inline-flex;align-items:center}
.cat{width:408px;height:212px;border-radius:32px;padding:30px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.cat .gl{width:68px;height:68px;border-radius:20px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.cat .big{position:absolute;right:-30px;bottom:-40px;width:200px!important;height:200px!important;opacity:.14;stroke-width:1.4}
.cat b{font-size:28px;font-weight:600;letter-spacing:-.3px}.cat span{font-size:18px;color:rgba(255,255,255,.75);font-weight:500;display:block;margin-top:4px}
.ar{height:116px;padding:0 28px;gap:24px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center}
.ar:last-child{border:none}
.ar .icon{width:76px;height:76px;border-radius:20px}.ar .icon svg{width:36px;height:36px}
.ar .t{flex:1}.ar .t b{font-size:24px;font-weight:600;display:block}.ar .t span{font-size:18px;color:var(--t3);font-weight:500}
.del{width:56px;height:56px;border-radius:28px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;color:#FF8A8A;flex:none}
.del.is-focus{background:#FF6A6A;color:#fff}
.seg{height:68px;border-radius:20px;padding:0 20px;justify-content:space-between;font-size:23px;font-weight:500;color:var(--t2);display:flex;align-items:center;margin-bottom:6px}
.seg.sel{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
.seg.is-focus{background:rgba(255,255,255,.18);transform:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7)!important}
.cnt{min-width:36px;height:30px;padding:0 10px;border-radius:15px;background:rgba(255,255,255,.14);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center}.cnt.a{background:var(--accent);color:#fff}

/* keyboard */
.field{position:absolute;top:156px;left:340px;width:1240px;height:96px;border-radius:48px;padding:0 20px 0 36px;gap:20px;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 2px rgba(255,255,255,.6);display:flex;align-items:center}
.caret{width:3px;height:42px;background:var(--accent);margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.rchip{border-radius:24px;padding:14px 28px 14px 14px;gap:18px;display:flex;align-items:center;flex:none}
.rchip .icon{width:68px;height:68px;border-radius:18px}.rchip .icon svg{width:32px;height:32px}
.kb{position:absolute;top:452px;left:50%;transform:translateX(-50%);border-radius:40px;padding:32px;gap:12px;background:rgba(28,34,52,.72);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(60px);box-shadow:0 30px 80px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center}
.krow{display:flex;gap:12px}
.k{width:96px;height:84px;border-radius:18px;background:rgba(255,255,255,.10);display:flex;align-items:center;justify-content:center;gap:10px;font-size:32px;font-weight:500}
.k.m{background:rgba(255,255,255,.16);font-size:22px;font-weight:600}.k.m svg{width:30px;height:30px}
.k.on{background:rgba(91,140,255,.45)}
.k.go{background:var(--accent);font-size:24px;font-weight:600}
.k.is-focus{background:#fff;color:#0B0F1A;box-shadow:0 16px 40px rgba(91,140,255,.55)!important;transform:scale(1.07)}
.sug{height:52px;padding:0 24px;border-radius:26px;display:flex;align-items:center;font-size:20px;font-weight:600;color:var(--t2)}
.sug.is-focus{background:#fff;color:#0B0F1A;transform:none}

/* tv */
.live{height:30px;padding:0 12px;border-radius:15px;background:var(--live);font-size:15px;font-weight:800;letter-spacing:1px;display:inline-flex;align-items:center;gap:6px;color:#fff}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.4s steps(1) infinite}
.chn{height:30px;padding:0 10px;border-radius:8px;background:rgba(255,255,255,.16);font-size:17px;font-weight:700;display:inline-flex;align-items:center}
.epg{position:absolute;left:96px;top:630px;width:1728px;height:410px}
.erow{position:relative;height:72px;margin-bottom:8px}
.ch{position:absolute;left:0;top:0;width:264px;height:72px;border-radius:16px;background:rgba(255,255,255,.06);display:flex;align-items:center;gap:14px;padding:0 18px}
.ch .num{font-size:17px;font-weight:700;color:var(--t3);width:34px}
.ch .lg{flex:none;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.ch .nm{font-size:20px;font-weight:600;white-space:nowrap}
.tl{position:absolute;left:280px;top:0;width:1448px;height:72px;overflow:hidden}
.pr{position:absolute;top:0;height:72px;border-radius:14px;background:rgba(22,29,48,.92);padding:0 18px;display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden;white-space:nowrap}
.pr b{font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px}.pr span{font-size:16px;color:var(--t3);font-weight:500}
.pr.now{background:rgba(44,52,74,.95)}
.pr.is-focus{background:rgba(70,80,108,.98);box-shadow:inset 0 0 0 3px #fff!important;transform:none}
.recdot{width:10px;height:10px;border-radius:50%;background:#FF6A6A;flex:none}
.ctl{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(30px)}
.ctl svg{width:30px;height:30px}
.ctl.is-focus{background:#fff;color:#0B0F1A;transform:scale(1.1)}
.ctl.big{width:96px;height:96px}
.ctl.off{opacity:.5}
.player-ui{transition:opacity .35s}
.ui-hidden .player-ui{opacity:0;pointer-events:none}
.paused .anim,.paused .anim *{animation-play-state:paused!important}
@keyframes ball{0%{transform:translate(0,0)}25%{transform:translate(380px,-120px)}50%{transform:translate(620px,80px)}75%{transform:translate(220px,180px)}100%{transform:translate(0,0)}}
@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes rise{from{transform:translateY(0);opacity:.7}to{transform:translateY(-700px);opacity:0}}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(2200px)}}
@keyframes sweep{0%,100%{transform:rotate(-25deg)}50%{transform:rotate(25deg)}}
.chbanner{position:absolute;left:96px;top:56px;display:flex;align-items:center;gap:14px}

/* remote */
#rc{position:fixed;right:16px;bottom:16px;z-index:1000;font-family:Inter,Arial,sans-serif;color:#F5F7FB}
#rc .body{width:188px;padding:16px;border-radius:28px;background:rgba(20,24,36,.92);border:1px solid rgba(255,255,255,.14);box-shadow:0 20px 50px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;gap:10px}
#rc.min .body{display:none}
#rc button{font:inherit;color:inherit;border:none;background:rgba(255,255,255,.1);border-radius:12px;height:34px;font-size:12px;font-weight:600;cursor:pointer}
#rc button:hover{background:rgba(255,255,255,.2)}
#rc button:active{background:#5B8CFF}
#rc .pad{position:relative;width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.08)}
#rc .pad button{position:absolute;width:40px;height:40px;border-radius:50%;font-size:14px}
#rc .pad .u{left:46px;top:4px}#rc .pad .d{left:46px;bottom:4px}#rc .pad .l{left:4px;top:46px}#rc .pad .r{right:4px;top:46px}
#rc .pad .ok{left:38px;top:38px;width:56px;height:56px;background:rgba(255,255,255,.2)}
#rc .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
#rc .tog{width:100%;height:30px;font-size:12px;background:rgba(91,140,255,.25)}
#rc .help{font-size:10.5px;line-height:1.45;color:rgba(245,247,251,.55);text-align:center}
#rc.min .tog{width:auto;padding:0 14px;height:40px;border-radius:20px;background:rgba(20,24,36,.92);border:1px solid rgba(255,255,255,.2)}
/* settings: sub-pages, pickers, text entry, screen saver */
.ri .main{display:flex;align-items:center;gap:20px;min-width:0}
.ri .lead{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);flex:none;overflow:hidden}
.ri .lead:has(>i){background:none}
.ri.dis{opacity:.45}.ri.danger{color:#FF8A8A}
.intro{font-size:21px;line-height:1.5;color:var(--t2);margin:-16px 0 28px 8px;max-width:960px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.sig{display:flex;align-items:flex-end;gap:3px;height:22px}.sig i{width:5px;border-radius:2px;background:rgba(255,255,255,.25)}.sig i.on{background:currentColor}
.pick{max-height:600px;overflow:auto;margin:0 -12px;padding:0 12px 4px}
.dbtn.dis{opacity:.45}.dbtn .d{font-size:17px;color:var(--t3);font-weight:500}
#tint{position:absolute;inset:0;pointer-events:none;z-index:88;mix-blend-mode:soft-light;opacity:0;transition:opacity .4s,background .4s}
#saver{position:absolute;inset:0;z-index:85;background:#000;opacity:0;pointer-events:none;transition:opacity .2s;overflow:hidden}
#saver.show{opacity:1;pointer-events:auto;transition:opacity .8s}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.1) translate(-2%,-1%)}}
/* mock apps */
.mc{display:flex;flex-direction:column;gap:4px;flex:none}

.mc .n{font-size:22px;font-weight:600;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mc .c{font-size:17px;color:var(--t3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.mgrid{display:grid;padding:0 96px}

.notec b{font-size:26px}.notec span{font-size:20px;line-height:1.45;opacity:.8;flex:1;overflow:hidden}.notec i{font-style:normal;font-size:16px;opacity:.6}
.notec.new{background:rgba(255,255,255,.08);color:#fff;border:2px dashed rgba(255,255,255,.3);align-items:center;justify-content:center}
.pcard{width:180px;height:180px;border-radius:28px;background:linear-gradient(135deg,#4F7BFF,#2A3FD9);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.16)}
.pcard.up{background:rgba(255,255,255,.92);color:#0B0F1A}.pcard.done{opacity:.5}
.swatch{width:72px;height:72px;border-radius:50%;border:4px solid rgba(255,255,255,.25)}.swatch.on{border-color:#fff}.swatch.is-focus{transform:scale(1.15)}
.choice{height:110px;border-radius:28px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:600}
.choice.ok{background:#1E8C6E}.choice.bad{background:#B83A4E}.choice.is-focus{background:#fff;color:#0B0F1A;transform:scale(1.04)}

/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function applyEffects(){
 $('#dim').style.opacity=((100-S.backlight)/100*0.65).toFixed(3);
 $('#warm').style.opacity=S.nightLight?(.06+S.nightStr*.0024).toFixed(3):0;
 const t=$('#tint');t.style.background=S.colorTemp==='Warm'?'#FFB066':'#7FB2FF';t.style.opacity=S.colorTemp==='Standard'?0:.35;
 /* only add filters that differ from the defaults: a filter on #view changes how the glass blur behind it looks */
 const f=[{Vivid:'saturate(1.3) contrast(1.05)',Cinema:'sepia(.12) brightness(.95) contrast(1.05)',Game:'contrast(1.08)'}[S.picMode]||''];
 if(S.contrast!==50)f.push(`contrast(${(.7+S.contrast*.006).toFixed(3)})`);
 if(S.saturation!==50)f.push(`saturate(${(.5+S.saturation/100).toFixed(3)})`);
 view.style.filter=f.join(' ').trim();
}
/* system sounds: a short soft click, scaled by the volume */
let actx=null;
function sfx(kind){
 if(!S.sysSounds||S.muted||!S.vol)return;
 try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type='sine';o.frequency.value=kind==='ok'?880:1320;g.gain.setValueAtTime(.04*S.vol/100,t);g.gain.exponentialRampToValueAtTime(.0001,t+.06);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.07)}catch(e){}
}
function slide(key,delta,abs){
 if(abs!=null)S[key]=Math.round(clamp(abs,0,100)); else S[key]=clamp(S[key]+delta,0,100);

 applyEffects();
}

function settingsMain(){

 let P=null;
 while(S.sub.length){const s=S.sub[S.sub.length-1];P=SUB[s.id](s.arg);if(P)break;S.sub.pop()}
 if(!P)P={title:meta[1],groups:spage(page)};
 const path=['Settings',meta[1],...S.sub.map(s=>(SUB[s.id](s.arg)||{}).title)];
 const pre=page+S.sub.map(s=>'/'+s.id+(s.arg?':'+s.arg:'')).join('');
 return `<div class="crumb">${path.map(esc).join(' › ')}</div><div class="h1">${esc(P.title)}</div>${P.intro?`<div class="intro">${esc(P.intro)}</div>`:''}`+

/* re-draw the right-hand pane, keeping focus on the same row when it still exists */
function refreshSettings(){
 if(cur.id!=='settings')return; const sm=$('#smain'); if(!sm)return;
 const k=focusEl&&focusEl.dataset.k, inMain=!!(focusEl&&sm.contains(focusEl)), st=sm.scrollTop;
 sm.innerHTML=settingsMain(); sm.scrollTop=st; tick();
 if(layers.length)return;
 const el=k&&$(`[data-k="${CSS.escape(k)}"]`,view);
 focusEl=null;
 if(el&&visible(el))setFocus(el,{instant:true});
 else if(inMain)setFocus($('[data-default]',sm)||$('[data-f]',sm)||$(`[data-spage="${S.settingsPage}"]`),{instant:true});
 else restoreFocus(k);
}
let lastMain=null;
function focusMain(key){
 const sm=$('#smain'); if(focusEl)focusEl.classList.remove('is-focus'); focusEl=null;
 setFocus((key&&$(`[data-k="${CSS.escape(key)}"]`,sm))||$('[data-default]',sm)||$('[data-f]',sm)||$(`[data-spage="${S.settingsPage}"]`),{instant:true});

function openSub(spec){
 if(cur.id!=='settings')return;
 const i=spec.indexOf(':'), id=i<0?spec:spec.slice(0,i), arg=i<0?'':spec.slice(i+1);
 S.sub.push({id,arg,from:focusEl&&focusEl.dataset.k});

SCREENS.settings={
 render(p){
  if(p.page&&p.page!==S.settingsPage){S.settingsPage=p.page;S.sub=[]}
  const page=S.settingsPage;
  return `<div class="side glass"><h2>Settings</h2>${SPAGES.map(([id,n,i,c])=>`<div ${F('sp-'+id,'spage:'+id,'nit'+(id===page?' sel':''),'data-spage="'+id+'"'+(id===page?' data-default':''))}><div class="b" style="background:${c}">${ic(i,22)}</div>${esc(n)}</div>`).join('')}</div>
  <div class="smain scroller" data-sk="smain" id="smain">${settingsMain()}</div>`;
 },
 /* Right from the sidebar enters the page at the row used last; Left from the page returns to this section's sidebar item */
 onMove(dir){
  const sm=$('#smain'), inMain=sm.contains(focusEl);
  if(dir==='right'&&!inMain){focusMain(lastMain);return true}
  if(dir==='left'&&inMain){setFocus($(`[data-spage="${S.settingsPage}"]`));return true}
  return false;
 },
 onFocus(el){
  if($('#smain')&&$('#smain').contains(el)){lastMain=el.dataset.k;return}
  const pg=el.dataset.spage; if(!pg||pg===S.settingsPage)return;
  S.settingsPage=pg; S.sub=[]; lastMain=null; cur.p.page=pg; $('#smain').innerHTML=settingsMain(); $('#smain').scrollTop=0; tick();
  $$('.nit').forEach(n=>n.classList.toggle('sel',n.dataset.spage===pg));
  mem[screenKey()]=el.dataset.k;
 },
 /* Back: closes the sub-page first, then moves focus to the sidebar, then leaves Settings */
 onBack(){
  const sm=$('#smain');
  if(S.sub.length){const s=S.sub.pop();sm.innerHTML=settingsMain();tick();focusMain(s.from);return true}
  if(focusEl&&sm.contains(focusEl)){setFocus($(`[data-spage="${S.settingsPage}"]`));return true}
  return false;
 },
};

 list:async()=>{const page=1+Math.floor(Date.now()/864e5)%15,r=await fetch(`https://picsum.photos/v2/list?page=${page}&limit=60`);if(!r.ok)throw new Error('HTTP '+r.status);
  return (await r.json()).filter(p=>p.width/p.height>1.3).map(p=>({id:p.id,author:p.author}))},
 url:(p,w=1920,h=1080)=>`https://picsum.photos/id/${p.id}/${w}/${h}`,
};
const preload=u=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(u);im.onerror=rej;im.src=u});
function loadPhotos(){
 if(!photosOn()||PH.state==='loading')return Promise.resolve();
 if(PH.list.length){applyWall();return Promise.resolve()}
 PH.state='loading';refreshSettings();
 return SYS.photos.list().then(L=>{PH.list=L;PH.state=L.length?'ok':'error'}).catch(()=>{PH.state='error'}).then(()=>{refreshSettings();applyWall();if(cur.id==='app'&&['gallery','frame'].includes(cur.p.id)&&!layers.length)refresh()});
}
const photoNote=()=>S.photoSrc!=='Online'?'Built-in pictures. Nothing is downloaded':!online()?'Offline · using built-in pictures for now':PH.state==='loading'?'Loading photos…':PH.state==='error'?'Couldn\'t reach picsum.photos · using built-in pictures':`Lorem Picsum · ${PH.list.length} photos from Unsplash`;
/* Home background: one photo per day */
let wallP=null;
function applyWall(){
 const w=$('#wall');
 if(S.wall==='Photo of the day'&&photosOn()&&PH.list.length){const p=PH.list[Math.floor(Date.now()/864e5)%PH.list.length],u=SYS.photos.url(p);if(wallP===p)return;
  preload(u).then(()=>{if(S.wall!=='Photo of the day'||!photosOn())return;wallP=p;w.style.background=`linear-gradient(180deg,rgba(7,10,20,.62),rgba(7,10,20,.38) 45%,rgba(7,10,20,.88)),#070A14 url('${u}') center/cover`;if(cur.id==='home'&&!layers.length)refresh()}).catch(()=>{})}
 else{const had=wallP;wallP=null;w.style.background='';if(had&&cur.id==='home'&&!layers.length)refresh()}
}
const wallCredit=()=>wallP?`<div class="abs" style="left:96px;bottom:44px;font-size:17px;color:var(--t3);font-weight:500">Photo: ${esc(wallP.author)} · Unsplash</div>`:'';

const LAYOUTS={abc:['qwertyuiop','asdfghjkl','zxcvbnm'],'123':['1234567890','-/:;()&@"\'',',.?!#%+=']};
function searchBody(){
 const L=LAYOUTS[S.kbMode], up=S.kbShift&&S.kbMode==='abc';
 const k=(c,i,r)=>`<div ${F('k-'+S.kbMode+'-'+r+'-'+i,'key:'+encodeURIComponent(c).replace(/'/g,'%27'),'k',r===0&&i===0?'data-default':'')}>${esc(up?c.toUpperCase():c)}</div>`;
 return `<div class="field"><span style="color:var(--t2)">${ic('search',32)}</span><div class="row" style="font-size:34px;font-weight:500"><span id="q"></span><div class="caret"></div></div><div style="flex:1"></div>
   <div ${F('k-mic','voice','chip','style="background:rgba(255,255,255,.12);width:60px;height:60px;border-radius:30px;padding:0"')}>${ic('mic',26)}</div></div>
  <div class="abs" id="reslabel" style="top:276px;left:352px;font-size:20px;font-weight:600;color:var(--t3)"></div>
  <div class="abs scroller row" id="results" data-sk="res" style="top:300px;left:0;right:0;gap:20px;padding:12px 340px 20px"></div>
  <div class="kb"><div class="krow" id="sugs" style="margin-bottom:8px;min-height:52px"></div>
   <div class="krow">${[...L[0]].map((c,i)=>k(c,i,0)).join('')}</div>
   <div class="krow">${[...L[1]].map((c,i)=>k(c,i,1)).join('')}</div>
   <div class="krow"><div ${F('k-shift','shift','k m'+(S.kbShift?' on':''),'style="width:150px"')}>${S.kbMode==='abc'?ic('shift'):'#+='}</div>${[...L[2]].map((c,i)=>k(c,i,2)).join('')}<div ${F('k-del','bksp','k m','style="width:150px"')}>${ic('backspace')}</div></div>
   <div class="krow"><div ${F('k-mode','kbmode','k m','style="width:150px"')}>${S.kbMode==='abc'?'?123':'ABC'}</div><div ${F('k-clear','clear','k m')} title="Clear">${ic('x',28)}</div><div ${F('k-at','key:%40','k')}>@</div><div ${F('k-space','key:%20','k','style="width:426px;font-size:22px;color:var(--t2)"')}>space</div><div ${F('k-dot','key:.','k')}>.</div><div ${F('k-go','searchgo','k go','style="width:190px"')}>${ic('search',28)}Search</div></div></div>
  <div class="hints" style="bottom:36px"><span><span class="key">◀ ▶ ▲ ▼</span>Move</span><span><span class="key">OK</span>Type</span><span><span class="key">Any key</span>Type with your keyboard</span><span><span class="key">Esc</span>Back</span></div>`;
}
function searchResults(){
 const q=S.query.trim().toLowerCase();
 const pool=[...LAUNCH.filter(a=>!a.hidden).map(a=>({...a,kind:a.kind||'Installed app',local:true})),...CATALOG.filter(shown)];
 if(!q)return {label:'Popular in the Store',list:['reel','orbit','frame','arcade','fitflow'].map(id=>CATALOG_BY[id]).filter(shown)};
 const list=pool.filter(a=>(a.name+' '+(a.kind||'')+' '+(a.cat||'')).toLowerCase().includes(q)).slice(0,8);
 return {label:list.length?`Results for “${S.query}”`:`Nothing found for “${S.query}”`,list};
}
function updateSearch(){
 const qEl=$('#q'); if(!qEl)return;
 qEl.textContent=S.query||''; qEl.style.color=S.query?'':'var(--t3)'; if(!S.query)qEl.textContent='Search apps';
 const {label,list}=searchResults();
 $('#reslabel').textContent=label;
 $('#results').innerHTML=list.map(a=>`<div ${F('res-'+a.id,a.local?'open:'+a.id:'details:'+a.id,'rchip glass')}><div class="icon ${appGrad(a)}">${ic(a.glyph,32)}</div><div class="col"><b style="font-size:22px">${esc(a.name)}</b><span style="font-size:16px;color:var(--t3)">${esc(a.local?'On this TV':a.installed?'Installed · '+a.kind:a.kind)}</span></div></div>`).join('');
 const q=S.query.toLowerCase(); const words=['video','video player','music','games','podcasts','news','kids','weather','photos','radio','chess','fitness'];
 const sugs=(q?words.filter(w=>w.startsWith(q)&&w!==q):['video player','music','kids','radio']).slice(0,4);
 $('#sugs').innerHTML=sugs.map(s=>`<div ${F('sug-'+s,'sug:'+encodeURIComponent(s),'sug glass')}>${esc(s)}</div>`).join('');
}
function typeChar(c){S.query=(S.query+c).slice(0,40);if(S.kbShift){S.kbShift=false;refreshKbKeys()}updateSearch()}
function refreshKbKeys(){const k=focusEl&&focusEl.dataset.k;const kb=$('.kb');if(!kb)return;const tmp=document.createElement('div');tmp.innerHTML=searchBody();kb.replaceWith($('.kb',tmp));updateSearch();restoreFocus(k)}

/* ---------- TV ---------- */
function tvBase(){const d=new Date();d.setSeconds(0,0);d.setMinutes(d.getMinutes()<30?0:30);return d}
const PX=1448/120;
function progInfo(ch,i){const base=tvBase(),[t,s,dur,genre]=ch.progs[i];const st=new Date(base.getTime()+s*60000),en=new Date(st.getTime()+dur*60000);const now=Date.now();return {title:t,start:st,end:en,genre,airing:now>=st&&now<en,pct:clamp((now-st)/(en-st),0,1),ch,i,key:ch.n+'-'+i}}
function nowProg(ch){for(let i=0;i<ch.progs.length;i++){const p=progInfo(ch,i);if(p.airing)return p}return progInfo(ch,0)}
let guideSel=null;
function previewHTML(p){
 const left=Math.max(0,Math.round((p.end-Date.now())/60000));
 return `<div class="row" style="gap:12px"><span class="chn">${p.ch.n}</span><span style="font-size:22px;font-weight:600;color:var(--t2)">${esc(p.ch.name)}</span>${p.airing?'<span class="live">LIVE</span>':`<span class="chn" style="background:rgba(91,140,255,.3)">Later · ${hm(p.start)}</span>`}</div>
  <div style="font-size:52px;font-weight:700;letter-spacing:-1.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:960px">${esc(p.title)}</div>
  <div style="font-size:22px;color:var(--t2)">${hm(p.start)} – ${hm(p.end)} · ${esc(p.genre)} · HD${S.cc?' · Subtitles':''}</div>
  <div class="row" style="gap:16px;margin-top:4px"><div style="width:520px;height:6px;border-radius:3px;background:rgba(255,255,255,.16)"><div style="width:${p.pct*100}%;height:6px;border-radius:3px;background:var(--accent)"></div></div><span style="font-size:18px;color:var(--t3)">${p.airing?left+' min left':p.end<=Date.now()?'Ended':'Starts in '+Math.round((p.start-Date.now())/60000)+' min'}</span></div>
  <div style="font-size:20px;line-height:1.5;color:var(--t2);max-width:900px">${esc(DESC[p.title]||'')}</div>`;
}
function previewButtons(p){

}

let installT=null;
function startInstall(id){
 const a=CATALOG_BY[id]; if(S.installing[id]!=null)return;
 if(!online()){toast('You\'re offline. Connect to a network to install apps','wifioff');return}
 S.installing[id]=0; refresh(); refreshLayer();
 if(!installT)installT=setInterval(()=>{
  let done=[];
  for(const k in S.installing){S.installing[k]=Math.min(100,S.installing[k]+2+Math.random()*4);if(S.installing[k]>=100)done.push(k)}
  for(const k in S.installing){for(const el of $$(`[data-prog="${k}"]`)){el.style.setProperty('--p',S.installing[k]+'%');const l=$('.lt',el);if(l)l.textContent=(CATALOG_BY[k].installed?'Updating ':'Installing ')+Math.round(S.installing[k])+'%'}}
  for(const k of done){const a=CATALOG_BY[k];delete S.installing[k];const wasUpd=a.installed&&a.next;if(wasUpd){a.ver=a.next;delete a.next}a.installed=true;toast(`${a.name} ${wasUpd?'updated':'installed'}`)}
  if(done.length)refresh();
  if(!Object.keys(S.installing).length){clearInterval(installT);installT=null}
 },90);
}
function openApp(id){
 const a=appInfo(id); if(!a)return;

 if(a.go){a.go[0]==='settings'?ACT.gos(a.go[1].page):go(a.go[0],{...a.go[1]});return}
 if(CATALOG_BY[id]&&!CATALOG_BY[id].installed){go('details',{id});return}

/* ---------- screen saver, sleep timer and turning off when idle ---------- */
const PHOTOS=['radial-gradient(1200px 700px at 30% 30%,#FFB37A,#C2477A 45%,#2A1B4D)','linear-gradient(180deg,#7FD3FF,#E8F6FF 55%,#6DB37E 56%,#2E6B4A)','radial-gradient(1000px 800px at 70% 60%,#5ED0FF,#2385D6 40%,#0B1B4A)','linear-gradient(160deg,#FFC24B,#F07A2B 40%,#5A3BE0)','radial-gradient(900px 600px at 50% 80%,#3DD6B0,#14907A 40%,#062A2A)'];
let lastInput=Date.now(),saverOn=false,saverAt=0,saverN=0,offWarn=null;
function showSaver(){if(S.saverType==='Off')return;if(photosOn()&&!PH.list.length)loadPhotos();saverOn=true;saverAt=Date.now();saverN=0;drawSaver();$('#saver').classList.add('show')}
function hideSaver(){if(!saverOn)return;saverOn=false;$('#saver').classList.remove('show');lastInput=Date.now()}
function drawSaver(){
 const el=$('#saver'); saverN++;
 if(S.saverType==='Clock'){const x=160+(saverN*373)%1000,y=140+(saverN*211)%560; /* moves so nothing burns in */
  el.innerHTML=`<div class="abs col" style="left:${x}px;top:${y}px;gap:8px;animation:fade 1.2s"><div data-clock style="font-size:150px;font-weight:300;letter-spacing:-4px;line-height:1"></div><div data-date style="font-size:28px;color:rgba(255,255,255,.6);font-weight:500"></div></div>`}
 else{
  if(!$('#saverimg',el)){el.innerHTML=`<div class="abs" id="saverimg" style="inset:0"></div><div class="abs" style="inset:auto 0 0 0;height:320px;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent)"></div><div class="abs" style="right:96px;bottom:72px;text-align:right;text-shadow:0 2px 20px rgba(0,0,0,.5)"><div data-clock style="font-size:72px;font-weight:600;letter-spacing:-1.5px"></div><div data-date style="font-size:24px;font-weight:500;color:rgba(255,255,255,.85)"></div><div id="savercr" style="font-size:18px;color:rgba(255,255,255,.75);margin-top:10px"></div></div>`}
  const n=saverN,add=(bg,cr)=>{if(!saverOn||n!==saverN)return;const box=$('#saverimg');if(!box)return;const d=document.createElement('div');d.className='abs';d.style.cssText=`inset:0;${bg};animation:fade 1.5s,kenburns 16s linear forwards`;box.appendChild(d);while(box.children.length>2)box.firstChild.remove();$('#savercr').textContent=cr};
  if(photosOn()&&PH.list.length){const p=PH.list[PH.i++%PH.list.length],u=SYS.photos.url(p);preload(u).then(()=>add(`background:#000 url('${u}') center/cover`,'Photo: '+p.author+' · Unsplash')).catch(()=>add(`background:${PHOTOS[n%PHOTOS.length]}`,''))}
  else add(`background:${PHOTOS[n%PHOTOS.length]}`,'');
 }
 tick();
}
/* any input wakes the screen saver; returns true when the key should do nothing else */
function noteInput(){lastInput=Date.now();if(saverOn){hideSaver();return true}return false}
function idleChecks(now){
 if(['standby','boot'].includes(cur.id))return;
 if(saverOn&&(now-saverAt)%15000<1000&&now-saverAt>999)drawSaver();
 if(!saverOn&&S.saverType!=='Off'&&!mediaBusy()&&!layers.some(l=>l.name==='text'||l.name==='offwarn')&&now-lastInput>mins(S.saverDelay)*60000)showSaver();
 /* the sleep timer or "turn off when idle", whichever comes first, warns one minute ahead */
 let at=null,why='';
 if(S.sleepAt){at=S.sleepAt;why='sleep'}
 const lim=mins(S.autoOff); if(lim&&(at==null||lastInput+lim*60000<at)){at=lastInput+lim*60000;why='idle'}
 const open=offWarn&&layers.includes(offWarn);
 if(at==null||at-now>60000){if(open&&layers[layers.length-1]===offWarn)closeLayer();offWarn=null;return}
 if(now>=at){offWarn=null;powerOff();return}
 if(!open){hideSaver();const w=why;offWarn=dialog(w==='sleep'?'Sleep timer':'Still watching?','<span id="offcd"></span>',[{label:'Keep watching',icon:'play',fn:()=>{if(w==='sleep'){S.sleep='Off';S.sleepAt=null;toast('Sleep timer off','moon')}lastInput=Date.now()}},{label:'Turn off now',icon:'power',fn:powerOff}],{name:'offwarn'})}
 const sec=Math.ceil((at-now)/1000),e=$('#offcd'); if(e)e.textContent=`The TV will turn off in ${sec} second${sec===1?'':'s'}.`;
}

 appact:(id)=>{const a=CATALOG_BY[id],st=appState(a);
  if(st==='get'&&a.anti&&S.st_warn)return dialog(`${a.name} has anti-features`,esc(a.anti.join(', '))+'. The app works, but it does things some people would rather avoid.',[{label:'Install anyway',icon:'download',fn:()=>startInstall(id)},{label:'Cancel',icon:'x'}],{def:1});
  if(st==='get'||st==='update')startInstall(id);else if(st==='open')go('app',{id});},
 uninstall:askUninstall,
 pinadd:(id)=>togglePin(id),
 updateall:()=>{installedStore().filter(a=>a.next).forEach(a=>startInstall(a.id))},
 libtab:(t)=>{S.libTab=t;refresh()},
 hero:(i)=>{S.heroIdx=+i;const h=$('#hero');if(h){h.innerHTML=heroHTML();refreshDots()}},
 addsource:()=>dialog('Add a source','Scan the code with your phone to send an address to the TV, or type it with the remote.',[{label:'Type an address',icon:'search',
  fn:()=>textEntry({title:'Source address',hint:'An F-Droid compatible repository, like https://apps.example.org/repo',value:'https://',validate:v=>validUrl(v)?'':'That doesn\'t look like a web address',onDone:addSourceUrl})},{label:'Close',icon:'x',fn:()=>{}}],{extra:`<div style="width:220px;height:220px;margin:0 auto 28px;border-radius:24px;background:#fff;padding:18px;display:grid;grid-template-columns:repeat(11,1fr);gap:2px">${[...Array(121)].map((_,i)=>`<i style="background:${(i*7919%13)<6||[0,1,2,11,13,22,23,24,8,9,10,19,21,30,31,32,88,89,90,99,101,110,111,112].includes(i)?'#0B0F1A':'transparent'}"></i>`).join('')}</div>`}),
 scan:()=>{let stop=false;
  const L=dialog('Scanning for channels','<span id="scanp">Starting…</span>',[{label:'Stop',icon:'x'}],{extra:'<div style="height:12px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;margin:-12px 0 20px"><div id="scanbar" style="height:12px;width:0;background:var(--accent);transition:width .15s"></div></div>'});
  L.onClose=()=>{stop=true};
  SYS.tv.scan(p=>{const e=$('#scanp'),b=$('#scanbar');if(e)e.textContent=`${p.mhz} MHz · ${p.found} channel${p.found===1?'':'s'} found`;if(b)b.style.width=p.pct*100+'%'},()=>stop)
   .then(n=>{if(n==null){toast('Scan stopped','tv');return}if(layers[layers.length-1]===L)closeLayer();toast(`Scan complete · ${n} channels, none new`,'tv')})},
 addplaylist:()=>textEntry({title:'IPTV playlist address',hint:'An M3U link, like https://tv.example.org/list.m3u',value:'https://',validate:v=>validUrl(v)?'':'That doesn\'t look like a web address',
  onDone:url=>{toast('Loading the playlist…','tv');SYS.tv.addPlaylist(url).then(n=>{S.playlists.push({name:hostOf(url),n,on:true});refresh();toast(`Playlist added · ${n} channels`,'tv')})}}),
 pltog:(i)=>{const p=S.playlists[+i];if(p){p.on=!p.on;refresh()}},
 key:(c)=>{c=decodeURIComponent(c);typeChar(S.kbShift&&S.kbMode==='abc'?c.toUpperCase():c)},
 shift:()=>{if(S.kbMode==='abc'){S.kbShift=!S.kbShift;refreshKbKeys()}else toast('More symbols would appear here','info')},
 kbmode:()=>{S.kbMode=S.kbMode==='abc'?'123':'abc';S.kbShift=false;refreshKbKeys()},
 bksp:()=>{S.query=S.query.slice(0,-1);updateSearch()},
 clear:()=>{S.query='';updateSearch()},
 sug:(s)=>{S.query=decodeURIComponent(s);updateSearch();const r=$('#results [data-f]');if(r)setFocus(r)},
 searchgo:()=>{const r=$('#results [data-f]');if(r)setFocus(r);else toast('Type something to search','search')},
 voice:()=>{if(!S.micAccess){toast('The microphone is off. Turn it on in Settings › Privacy','mic');return}toast('Listening… (say “music player”)','mic');setTimeout(()=>{S.query='music';updateSearch();toast('Heard: “music”','mic')},1600)},
 prog:(key)=>{const [n,i]=key.split('-').map(Number);const c=CHANNELS.find(x=>x.n===n);const p=progInfo(c,i);if(p.airing){S.tvCh=n;S.playing=true;go('player')}else if(p.end<=Date.now())toast('This programme has ended','clock');else ACT.remind(key)},
 guide:()=>{if(hist.length&&hist[hist.length-1].id==='tv')back();else go('tv',{tab:'guide'})},
 watch:(n)=>{S.tvCh=+n;S.playing=true;go('player')},
 rec:(key)=>{if(S.rec.has(key)){S.rec.delete(key);toast('Recording cancelled','record')}else{S.rec.add(key);toast('Recording scheduled','record')}rerenderTV()},
 remind:(key)=>{if(S.remind.has(key)){S.remind.delete(key);toast('Reminder removed','clock')}else{S.remind.add(key);toast('We\'ll remind you when it starts','clock')}rerenderTV()},
 fav:(n)=>{n=+n;S.fav.has(n)?S.fav.delete(n):S.fav.add(n);refresh()},
 playpause:()=>{S.playing=!S.playing;refresh();pokeUI()},
 chup:()=>changeChannel(1), chdown:()=>changeChannel(-1),
 cc:()=>{S.cc=!S.cc;refresh();toast('Subtitles '+(S.cc?'on':'off'),'cc')},
 audiotrk:()=>{cycle('audio');refresh();toast('Audio: '+S.audio,'speaker')},
 chlist:chListOverlay,
 switch:(n)=>{closeLayer();S.tvCh=+n;S.playing=true;refresh();pokeUI()},
 dlg:(i)=>{const L=layers[layers.length-1];const b=L.buttons[+i];L.chosen=+i;closeLayer();b&&b.fn&&b.fn()},
 help:()=>dialog('How to use this prototype','Move with the arrow keys (or hover with the mouse), press <b>Enter</b> or click to select, <b>Esc</b> to go back. <b>H</b> goes Home, <b>M</b> opens the quick panel, <b>+ / −</b> change the volume, <b>PgUp / PgDn</b> change channel. Hold <b>Enter</b> or right-click an app for options. The remote on the right does the same.',[{label:'Got it',icon:'check',fn:()=>{}}]),
 'ok-hint':()=>{},
 ax:runAx,
};
function rerenderTV(){if(cur.id==='tv'){const k=focusEl&&focusEl.dataset.k;guideSel&&(guideSel=progInfo(guideSel.ch,guideSel.i));render(false);restoreFocus(k)}else if(cur.id==='player')refresh()}
function changeChannel(d){const i=CHANNELS.findIndex(c=>c.n===S.tvCh);S.tvCh=CHANNELS[(i+d+CHANNELS.length)%CHANNELS.length].n;S.playing=true;if(cur.id==='player'){refresh();pokeUI()}else go('player')}
/* toggles that ask before they change something with side effects */
const GUARD={
 bt:on=>!on&&{title:'Turn off Bluetooth?',text:'Headphones and other accessories will disconnect. The remote keeps working with its basic buttons, but voice search stops until Bluetooth is back on.',ok:'Turn off'},
 diag:on=>on&&{title:'Share usage & diagnostics?',text:'Once a day the TV sends crash reports and anonymous counts of which screens are used to the Open TV project. Nothing is linked to you, and you can turn this off at any time.',ok:'Turn on'},
 st_usb:on=>on&&{title:'Allow installs from USB & files?',text:'Apps from files aren\'t checked by a source you trust. The TV still asks before each install.',ok:'Allow'},
 cec:on=>!on&&S.soundOut==='Soundbar (HDMI ARC)'&&{title:'Turn off HDMI-CEC?',text:'The soundbar is controlled through HDMI-CEC, so sound will move to the TV speakers.',ok:'Turn off'},
};
const CHANGE_TOAST={
 sleep:()=>[S.sleep==='Off'?'Sleep timer off':'The TV will turn off at '+hm(new Date(S.sleepAt)),'moon'],
 wifi:()=>[S.wifi?'Wi-Fi on'+(S.wifiNet?' · '+S.wifiNet:''):'Wi-Fi off',S.wifi?'wifi':'wifioff'],
 bt:()=>[S.bt?'Bluetooth on':'Bluetooth off','bluetooth'],
 picMode:()=>['Picture: '+S.picMode,'display'],
 soundOut:()=>['Sound: '+S.soundOut,'speaker'],
 soundMode:()=>['Sound mode: '+S.soundMode,'speaker'],
 saverType:()=>[S.saverType==='Off'?'Screen saver off':'Screen saver: '+S.saverType,'moon'],
 tz:()=>['Time zone: '+S.tz,'clock'],
 lang:()=>[`Language set to ${S.lang}. Translations aren't in the prototype yet`,'globe'],
 diag:()=>[S.diag?'Usage & diagnostics on':'Usage & diagnostics off','shield'],
 autoOff:()=>[S.autoOff==='Never'?'The TV stays on when idle':`The TV turns off after ${S.autoOff} without a button press`,'power'],
};
function afterChange(key){
 if(key==='input'&&S.input!=='Home screen'){closeAllLayers();go('app',{id:S.input==='HDMI 1'?'hdmi1':'hdmi2'});S.input='Home screen';return}
 if(key==='sleep')S.sleepAt=S.sleep==='Off'?null:Date.now()+mins(S.sleep)*60000;
 if(key==='autoTime'&&S.autoTime)S.timeAdj=0;
 if(key==='saverType'&&S.saverType==='Off')hideSaver();
 if(key==='bt'&&S.bt)S.btSeen=false;
 if(key==='photoSrc'&&S.photoSrc!=='Online')S.wall='Default';
 if(['photoSrc','wall','wifi'].includes(key)){loadPhotos();applyWall()}
 if(key==='wifi'&&S.wifi)S.wifiSeen=false;
 const fb=key==='bt'||key==='cec'?audioFallback():'';
 SYS.apply(key,S[key]);
 const t=CHANGE_TOAST[key];
 if(t){const [m,i]=t();toast(m+fb,i)}else if(fb)toast(fb[3].toUpperCase()+fb.slice(4),'speaker');
 tick(); applyEffects();
 if(layers.length&&layers[layers.length-1].render)refreshLayer();
 if(cur.id==='settings')refreshSettings();
 else if(!layers.length)refresh(); else{const k2=layers[layers.length-1].mem;render(false);layers[layers.length-1].mem=k2}
}
function addSourceUrl(url){
 toast('Checking the source…','shield');
 SYS.store.addSource(url).then(r=>dialog('Trust this source?',`<b>${esc(r.host)}</b> signs its apps with this key:<br><span style="font-family:monospace;font-size:20px;color:var(--text)">${r.fp}</span><br><br>Only add sources you trust. From now on, every app from it is checked against this key.`,
  [{label:'Add source',icon:'plus',fn:()=>{S.sources.push({id:'u'+Date.now(),name:r.host,d:'Added by you · signing key pinned',on:true,custom:true});refresh();toast(r.host+' added','check')}},{label:'Cancel',icon:'x'}],{def:1}));
}
function refreshDots(){const d=$('#dots');if(!d)return;$$('i',d).forEach((e,i)=>{const on=i===S.heroIdx%HERO.length;e.style.width=on?'28px':'8px';e.style.background=on?'#fff':'rgba(255,255,255,.3)'})}
function activate(el){
 if(!el)return; const a=el.dataset.act; if(!a)return;
 el.animate([{filter:'brightness(1)'},{filter:'brightness(1.35)'},{filter:'brightness(1)'}],{duration:220}); sfx('ok');
 const i=a.indexOf(':'); const cmd=i<0?a:a.slice(0,i), arg=i<0?'':a.slice(i+1);
 (ACT[cmd]||(()=>{}))(arg,el);
}
function options(){
 const el=focusEl; if(!el)return;
 const m=el.dataset.menu; if(!m){toast('No options here','info');return}
 const [kind,id]=m.split(':');
 if(kind==='ax'){ACT.ax(m.slice(3));return}
 if(kind==='src'){const x=S.sources.find(s=>s.id===id);if(!x.custom){toast('Built-in sources can be turned off, but not removed','info');return}
  dialog(x.name,'Apps you installed from this source stay on the TV but stop getting updates.',[{label:'Remove source',icon:'trash',danger:true,fn:()=>{S.sources=S.sources.filter(s=>s!==x);refresh();toast(x.name+' removed','trash')}},{label:'Cancel',icon:'x'}],{def:1});return}
 if(kind==='pl'){const pl=S.playlists[+id];if(!pl)return;dialog(pl.name,'',[{label:'Remove playlist',icon:'trash',danger:true,fn:()=>{S.playlists.splice(+id,1);refresh();toast('Playlist removed','trash')}},{label:'Cancel',icon:'x'}],{def:1});return}
 if(kind==='store'&&!CATALOG_BY[id].installed){dialog(CATALOG_BY[id].name,'',[{label:'Install',icon:'download',fn:()=>ACT.appact(id)},{label:'Details',icon:'info',fn:()=>go('details',{id})},{label:'Cancel',icon:'x',fn:()=>{}}]);return}
 appMenu(id);
}

/* ================= input ================= */
let okTimer=null,okLong=false;
function remoteKey(k){
 if(cur.id==='standby'){restart();return}
 if(cur.id==='boot')return;
 if(vpPoke(k))return;
 if(cur.id==='player'&&!layers.length){
  const hidden=$('#player')&&$('#player').classList.contains('ui-hidden');
  if(hidden&&(k==='up'||k==='down')){changeChannel(k==='up'?1:-1);return}
  pokeUI(); if(hidden&&(k==='left'||k==='right'||k==='ok'))return;
 }
 switch(k){
  case 'up':case 'down':case 'left':case 'right':move(k);break;
  case 'ok':activate(focusEl);break;
  case 'back':back();break;
  case 'home':goHome();break;
  case 'menu':openQP();break;
  case 'options':options();break;
  case 'volup':slide('vol',5);break;
  case 'voldown':slide('vol',-5);break;
  case 'mute':S.muted=!S.muted;hud();break;
  case 'chup':changeChannel(1);break;
  case 'chdown':changeChannel(-1);break;
 }
}
const typing=()=>(cur.id==='search'||(cur.id==='store'&&cur.p.tab==='search'))&&!layers.length;
document.addEventListener('keydown',e=>{
 const k=e.key;
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 if(noteInput()){e.preventDefault();return}
 const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Escape:'back',PageUp:'chup',PageDown:'chdown'};
 if(map[k]){e.preventDefault();remoteKey(map[k]);return}
 if(k==='Enter'){e.preventDefault();if(e.repeat)return;if(cur.id==='standby'){restart();return}okLong=false;clearTimeout(okTimer);okTimer=setTimeout(()=>{okLong=true;options()},550);return}
 if(textOpen()){
  if(k==='Backspace'){e.preventDefault();if(TE.v)ACT.tbksp();else closeLayer();return}
  if(k.length===1){e.preventDefault();teType(k);return}
  return;
 }
 if(typing()){
  if(k==='Backspace'){e.preventDefault();if(S.query)ACT.bksp();else back();return}
  if(k.length===1){e.preventDefault();typeChar(k);return}
  return;
 }
 if(k==='Backspace'){e.preventDefault();remoteKey('back');return}
 const m={h:'home',H:'home',m:'menu',M:'menu',o:'options',O:'options','+':'volup','=':'volup','-':'voldown','_':'voldown','0':'mute'};
 if(m[k]){e.preventDefault();remoteKey(m[k]);return}
 if(k==='?'){ACT.help();return}
 if(cur.id==='standby')restart();
});
document.addEventListener('keyup',e=>{if(e.key==='Enter'){clearTimeout(okTimer);if(!okLong&&okTimer)remoteKey('ok');okTimer=null}});
const tvEl=$('#tvbox');
let lastPt=null;tvEl.addEventListener('mousemove',e=>{if(lastPt&&Math.abs(e.clientX-lastPt[0])+Math.abs(e.clientY-lastPt[1])<3)return;lastPt=[e.clientX,e.clientY];lastInput=Date.now();if(saverOn){if(Date.now()-saverAt>800)hideSaver();return}vpWake();const f=e.target.closest('[data-f]');if(f&&f!==focusEl&&root().contains(f))setFocus(f,{scroll:false})});
tvEl.addEventListener('click',e=>{
 if(noteInput())return;
 if(cur.id==='standby'){restart();return}
 if(cur.id==='player'&&!layers.length){const h=$('#player').classList.contains('ui-hidden');pokeUI();if(h)return}
 if(vpWake())return;
 const sb=e.target.closest('[data-seekbar]');
 if(sb&&root().contains(sb)){const r=sb.getBoundingClientRect();setFocus(sb,{scroll:false});runAx('mseekto:'+(e.clientX-r.left)/r.width);return}
 const sl=e.target.closest('[data-slider]');
 if(sl&&root().contains(sl)){const t=$('.track',sl)||sl;const r=t.getBoundingClientRect();setFocus(sl,{scroll:false});slide(sl.dataset.slider,0,(e.clientX-r.left)/r.width*100);return}
 const el=e.target.closest('[data-act]'); if(!el||!root().contains(el))return;
 if(el.dataset.f!==undefined)setFocus(el,{scroll:false});
 activate(el);
});
tvEl.addEventListener('contextmenu',e=>{e.preventDefault();const f=e.target.closest('[data-f]');if(f){setFocus(f,{scroll:false});options()}});
tvEl.addEventListener('wheel',e=>{const s=e.target.closest('.scroller');if(!s){e.preventDefault()}},{passive:false});
$('#rc').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const r=b.dataset.r;
 if(r!=='toggle-remote'&&noteInput())return;
 if(r==='toggle-remote'){const R=$('#rc');R.classList.toggle('min');b.textContent=R.classList.contains('min')?'Show remote':'Hide remote';fit();return}
 remoteKey(r)});

/* ================= clock, scale, boot ================= */
function tick(){
 const d=new Date();
 $$('[data-clock]').forEach(e=>e.textContent=hm(d));
 $$('[data-date]').forEach(e=>e.textContent=dateStr());
 $$('[data-date-short]').forEach(e=>e.textContent=dateStr(true));
 if(cur.id==='tv'&&(cur.p.tab||'guide')==='guide'){const nx=(d-tvBase())/60000*PX;const l=$('#nowline'),p=$('#nowpill');if(l)l.style.left=(280+nx)+'px';if(p){p.style.left=(376+nx-30)+'px';p.textContent=hm(d)}}
}
let lastMin=new Date().getMinutes();
setInterval(()=>{tick();idleChecks(Date.now());appTick();const m=new Date().getMinutes();if(m!==lastMin){lastMin=m;if(m%30===0&&(cur.id==='tv'||cur.id==='player'))rerenderTV()}},1000);
setInterval(()=>{if(cur.id==='store'&&(cur.p.tab||'discover')==='discover'&&!layers.length){const h=$('#hero');if(h&&!h.contains(focusEl)){S.heroIdx=(S.heroIdx+1)%HERO.length;h.style.transition='opacity .3s';h.style.opacity=0;setTimeout(()=>{h.innerHTML=heroHTML();h.style.opacity=1;refreshDots()},300)}}},7000);
const scale=()=>{const r=$('#tvbox').getBoundingClientRect();return r.width/1920};
function fit(){const rw=$('#rc').classList.contains('min')?0:228;$('#stage').style.right=rw+'px';const s=Math.min((innerWidth-rw)/1920,innerHeight/1080);$('#tvbox').style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();
const _render=render; render=function(a){_render(a);tick()};
/* hook render to update clock */
cur={id:'home',p:{}};render(true);restoreFocus(null);
</script>

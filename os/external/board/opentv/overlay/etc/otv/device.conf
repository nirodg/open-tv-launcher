# /etc/otv/device.conf — the device description (one file per device).
#
# This is the Open TV analogue of Android's board configs + HAL configuration
# files: it names the gateway BACKEND each service uses on THIS device.
# The OS above the gateway (launcher, settings, apps) never changes between
# devices — only this file and the gateway backends it names.
#
# The QEMU targets ship an all-simulated device: screen, audio, network and
# storage are emulated. A real TV port writes its own file pointing at real
# backends (panel, ALSA/CEC, real mounts) and implements only the gateway
# interfaces those backends name.

[device]
# Board identity, shown in System & About later.
name = qemu
board = qemu-virt

[display]
# kms-dumb  = KMS/DRM dumb buffers + CPU rasterizer. No GPU, no vendor blobs
#             required — this is the default everywhere and the guaranteed
#             baseline (the "no reverse-engineering" rule).
# kms-gles2 = optional GPU path (GBM/EGL + GLES2) for devices that SHIP
#             working GL libraries — open drivers (panfrost/lima/v3d) or the
#             vendor's own EGL. Link what the device already provides; no
#             reverse-engineering is required. Declared, not in the build
#             yet: anything else falls back to kms-dumb with a clear log line.
backend = kms-dumb

[audio]
# null = silent (QEMU simulation) | alsa | tinyalsa (real board later).
backend = null
output = tv-speakers

[network]
# mock = the launcher's simulated state (QEMU); real = the OS network stack.
backend = mock

[storage]
# Mount points the launcher reads (Settings > Storage, later the Video app).
internal = /media/internal
external = /media/external

[samples]
# Sample clip for the Video app (regenerate: os/tools/make-samples.sh).
promo = /media/internal/promo.mp4
